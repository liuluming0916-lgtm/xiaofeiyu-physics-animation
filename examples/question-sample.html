<div class="page">
  <h2>3.（12 分）</h2>
  <div class="meta">高一物理 · 牛顿运动定律</div>
  <p>如图，倾角 θ = 37° 的斜面固定在水平地面上，斜面长 L = 5 m。一个质量 m = 2 kg 的物块从斜面顶端由静止释放，物块与斜面间的动摩擦因数 μ = 0.5。取 g = 10 m/s²，sin37° = 0.6，cos37° = 0.8。</p>
  <p>求：(1) 物块沿斜面下滑的加速度大小；(2) 物块滑到斜面底端所用的时间；(3) 物块到达底端时的速度大小；若斜面底端与水平面平滑连接，物块进入水平面后还能滑行多远？</p>
  <div class="fig">
    <svg width="360" height="150" viewBox="0 0 360 150">
      <line x1="20" y1="130" x2="340" y2="130" stroke="#333" stroke-width="2"/>
      <line x1="60" y1="130" x2="260" y2="130" stroke="#333" stroke-width="2"/>
      <line x1="60" y1="130" x2="260" y2="60" stroke="#333" stroke-width="2"/>
      <rect x="150" y="76" width="26" height="18" fill="#c9d6e8" stroke="#333" stroke-width="1.5" transform="rotate(-33 163 85)"/>
      <text x="120" y="112" font-size="14" fill="#333">37°</text>
      <text x="270" y="80" font-size="13" fill="#666">L = 5 m</text>
    </svg>
  </div>
  <div class="tag">（示意图仅供识别，不必按比例还原）</div>
</div>
</body>
