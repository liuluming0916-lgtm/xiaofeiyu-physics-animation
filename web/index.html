<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 标题不写版本号：版本由界面头从 package.json 注入，写死会随发版过期（v1.2.0 就踩过：还挂着 v1.1.19） -->
    <title>小肥鱼物理解题动画</title>
    <!--
      固定文件名（不带哈希）：由 web/rollup.config.mjs 产出到 dist/assets/。
      好处：门禁可断言这两个文件存在、且 index.html 的引用有效；离线双击也能直接用。
    -->
    <link rel="stylesheet" href="./assets/app.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="./assets/app.js" defer></script>
  </body>
</html>
